name: Repository Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  readme:
    name: README policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate LumioAgent specification
        run: |
          node .spec/tools/spec-lint.mjs
          node --test .spec/tools/spec-lint.test.mjs
      - name: Validate repository boundary documentation
        run: |
          test -s README.md
          test -s LICENSE
          test -s .gitattributes
          grep -q '^\*\.md text eol=lf$' .gitattributes
          grep -q '^## 这个仓是什么$' README.md
          grep -q '^## crate 一览$' README.md
          grep -q '^## SDK 如何编入$' README.md
          grep -q '^## 职责$' README.md
          grep -q '^## 明确不负责什么$' README.md
          grep -q '^## 收口门槛$' README.md

  native:
    name: Native workspace checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format, lint, build, test
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo build --workspace
          cargo test --workspace
      - name: Dependency DAG and artifact-shape assertions
        run: |
          cargo xtask check-dep-dag
          cargo xtask assert-no-native-artifacts
